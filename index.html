<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cheese Particle Colour Recognition</title>

    <!-- p5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/addons/p5.sound.min.js" defer></script>

    <!-- TensorFlow.js + Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"
        defer></script>

    <!-- Pose detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.0.0" defer></script>

    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <div id="container">
        <h1>Cheese Particle Colour Recognition</h1>

        <div class="instruction">
            <p>
                Models run automatically when the page loads.<br />
                Your shirt color determines your cheese type!
            </p>
            <p>Move your body to guide the cheese particles.</p>
        </div>

        <div id="cheeseDisplay">Initializing machine learning models...</div>
        <div id="status">Status: Loading...</div>

        <div id="webcam-container" style="display: none"></div>
        <div id="label-container" style="display: none"></div>
    </div>

    <!-- Load modules in correct order -->
    <script src="js/ml.js" defer></script>
    <script src="js/particles.js" defer></script>

    <!-- Auto-start ML -->
    <script defer>
        window.addEventListener("load", () => {
            initTeachableMachine(); // start automatically
        });
    </script>
</body>

</html>
