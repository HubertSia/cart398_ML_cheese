<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPCR</title>

    <!-- p5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/addons/p5.sound.min.js" defer></script>

    <!-- TensorFlow.js + Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"
        defer></script>

    <!-- Pose detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.0.0" defer></script>

    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <div id="container">
        
        <h1>CPCR</h1>
        <h3>Cheese Particle Colour Recognition</h3>
        
        <div class="instruction">
            <p>
                Models run when you press <strong>Start</strong>.<br />
                Your shirt color determines your cheese type!
            </p>
            <p>Move your body to guide the cheese particles.</p>
        </div>


        <div id="webcam-container" style="display: none"></div>
        <div id="label-container" style="display: none"></div>
    </div>
    
    <div id="cheeseDisplay">Press "Start" to begin!</div>
    <div id="status">Status: Idle.</div>

    
    
    <div class="controls">
        <button id="startBtn">Start</button>
        <button id="pauseBtn" disabled>Pause</button>
    </div>

    
    
    <!-- Load your modules -->
    <script src="js/ml.js" defer></script>
    <script src="js/particles.js" defer></script>

    <!-- Start / Pause control -->
    <script defer>
        let paused = false;

        window.addEventListener("load", () => {
            const startBtn = document.getElementById("startBtn");
            const pauseBtn = document.getElementById("pauseBtn");

            startBtn.addEventListener("click", async () => {
                if (!isRunning) {
                    await initTeachableMachine();
                } else if (paused) {
                    paused = false;
                    isRunning = true;
                }
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                const statusTxt = document.getElementById("status");
                if (statusTxt) statusTxt.textContent = "Status: Running...";
            });

            pauseBtn.addEventListener("click", () => {
                paused = true;
                isRunning = false;
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                const statusTxt = document.getElementById("status");
                if (statusTxt) statusTxt.textContent = "Status: Paused.";
            });
        });
    </script>
</body>

</html>
